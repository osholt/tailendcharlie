# Opens, checks and closes the external TestFlight group's PUBLIC link.
#
# A public link lets anyone with the address join the beta, up to the cap set
# here. Nothing in this workflow uploads a build or changes Beta App Review
# (`TestFlight` does that); it only changes who can join, and the beta test
# information they and Apple's reviewers read.
#
# Every write is a dry run unless `apply` is ticked. Enabling the link also needs
# the typed confirmation. Disabling needs neither, because the way to stop new
# people joining in an incident should be one click: it does NOT remove testers
# who already have a build. That is done by expiring the build in App Store
# Connect (docs/open-beta-launch.md, rollback).
name: TestFlight public link

on:
  workflow_dispatch:
    inputs:
      action:
        description: >-
          verify reads the group, the link and the test information and writes
          nothing. test-info sets the beta description, feedback email and
          privacy URL. public-link-enable and public-link-disable change who
          can join.
        required: true
        default: verify
        type: choice
        options:
          - verify
          - test-info
          - public-link-enable
          - public-link-disable
      apply:
        description: >-
          Send the change. Unticked is a dry run that prints the planned change
          and writes nothing. Ignored by verify.
        required: true
        default: false
        type: boolean
      link_limit:
        description: >-
          Most testers who may join through the link (1 to 10000). Phase 1 of the
          open beta is 100. Only public-link-enable uses it.
        required: true
        default: '100'
        type: string
      confirm_public_link:
        description: >-
          Type enable-public-link to turn the PUBLIC link on for real (with
          apply ticked). Ignored by every other action.
        required: false
        default: ''
        type: string
      expect_link:
        description: >-
          verify only: fail unless the link is in this state. Use disabled after
          a rollback and enabled after launch.
        required: true
        default: any
        type: choice
        options:
          - any
          - enabled
          - disabled

permissions:
  contents: read

concurrency:
  group: testflight-public-link
  cancel-in-progress: false

jobs:
  public-link:
    name: TestFlight public link
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require confirmation before opening the public link
        env:
          ACTION: ${{ inputs.action }}
          APPLY: ${{ inputs.apply }}
          CONFIRM: ${{ inputs.confirm_public_link }}
        run: |
          set -euo pipefail
          if test "$ACTION" = "public-link-enable" && test "$APPLY" = "true"; then
            test "$CONFIRM" = "enable-public-link" || {
              echo "::error::Opening the public link lets anyone with the address join. Type enable-public-link in confirm_public_link, or untick apply for a dry run." >&2
              exit 1
            }
          fi
      - name: Query or change App Store Connect
        env:
          ACTION: ${{ inputs.action }}
          APPLY: ${{ inputs.apply }}
          LINK_LIMIT: ${{ inputs.link_limit }}
          EXPECT_LINK: ${{ inputs.expect_link }}
          EXTERNAL_TESTER_GROUP: ${{ vars.RIDE_RELAY_IOS_EXTERNAL_TESTER_GROUP }}
          REVIEW_API_KEY_ID: ${{ secrets.APPSTORE_CONNECT_REVIEW_API_KEY_ID }}
          REVIEW_API_ISSUER_ID: ${{ secrets.APPSTORE_CONNECT_REVIEW_API_ISSUER_ID }}
          REVIEW_API_PRIVATE_KEY_BASE64: ${{ secrets.APPSTORE_CONNECT_REVIEW_API_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$EXTERNAL_TESTER_GROUP" || {
            echo "::error::Set RIDE_RELAY_IOS_EXTERNAL_TESTER_GROUP to the exact App Store Connect external tester group name." >&2
            exit 1
          }
          test -n "$REVIEW_API_KEY_ID"
          test -n "$REVIEW_API_ISSUER_ID"
          test -n "$REVIEW_API_PRIVATE_KEY_BASE64"

          umask 077
          review_key_path="$RUNNER_TEMP/AuthKey_$REVIEW_API_KEY_ID.p8"
          printf '%s' "$REVIEW_API_PRIVATE_KEY_BASE64" | base64 --decode > "$review_key_path"

          review_venv="$RUNNER_TEMP/testflight-public-link-venv"
          python3 -m venv "$review_venv"
          "$review_venv/bin/python" -m pip install --quiet "PyJWT[crypto]==2.10.1"

          common=(
            --bundle-id app.tailendcharlie
            --group "$EXTERNAL_TESTER_GROUP"
            --issuer-id "$REVIEW_API_ISSUER_ID"
            --key-id "$REVIEW_API_KEY_ID"
            --private-key "$review_key_path"
          )
          apply_flag=()
          if test "$APPLY" = "true"; then
            apply_flag=(--apply)
          fi
          tool=("$review_venv/bin/python" -m tools.testflight.beta_distribution)

          case "$ACTION" in
            verify)
              verify_args=(--expect-link "$EXPECT_LINK" --expected-limit "$LINK_LIMIT")
              if test "$EXPECT_LINK" = "disabled"; then
                # A rollback check asks one question. A missing build or test
                # information must not make "the link is off" look like a failure.
                verify_args+=(--check link)
              fi
              "${tool[@]}" verify "${common[@]}" "${verify_args[@]}"
              ;;
            test-info)
              "${tool[@]}" test-info "${common[@]}" "${apply_flag[@]}" \
                --description-file docs/open-beta-listing/testflight-beta-description.txt
              ;;
            public-link-enable)
              "${tool[@]}" public-link enable "${common[@]}" "${apply_flag[@]}" --limit "$LINK_LIMIT"
              ;;
            public-link-disable)
              "${tool[@]}" public-link disable "${common[@]}" "${apply_flag[@]}"
              ;;
            *)
              echo "::error::Unknown action $ACTION" >&2
              exit 1
              ;;
          esac
