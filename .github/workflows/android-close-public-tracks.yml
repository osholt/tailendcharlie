# Takes the app off any publicly available Google Play track.
#
# Open testing (`beta`) is public: anyone with the link may join and install.
# On 27 July 2026 it was found live on version code 7 while closed testing was
# on 30 - the app was generally available by accident, almost certainly because
# turning managed publishing off published a stale open-testing release that had
# been sitting in the Console queue.
#
# This workflow is deliberately manual, deliberately narrow, and requires a
# typed confirmation. It does not touch `internal` or `alpha`.
name: Close public Play tracks

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type close-public-tracks to confirm a write to Google Play
        required: true
        type: string
      halt_open_testing:
        description: Halt the live open-testing (beta) release
        required: true
        default: true
        type: boolean
      delete_production_draft:
        description: Delete the draft production release
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: android-play-write
  cancel-in-progress: false

jobs:
  close:
    name: Close public tracks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The Play service account is an environment secret, not a repository one.
    environment: android-internal
    env:
      PACKAGE_NAME: app.tailendcharlie
    steps:
      - name: Require typed confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          test "$CONFIRM" = "close-public-tracks" || {
            echo "Refusing: confirm must be exactly close-public-tracks." >&2
            exit 1
          }
      - name: Validate Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$SERVICE_ACCOUNT_JSON"
      - name: Install the Google API client
        run: pip install --quiet google-auth google-auth-httplib2 google-api-python-client
      - name: Close the public tracks
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          HALT_OPEN_TESTING: ${{ inputs.halt_open_testing }}
          DELETE_PRODUCTION_DRAFT: ${{ inputs.delete_production_draft }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$RUNNER_TEMP/play.json"
          python - <<'PY'
          import os

          from google.oauth2 import service_account
          from googleapiclient.discovery import build
          from googleapiclient.errors import HttpError

          package = os.environ["PACKAGE_NAME"]
          halt_beta = os.environ["HALT_OPEN_TESTING"] == "true"
          delete_production = os.environ["DELETE_PRODUCTION_DRAFT"] == "true"
          credentials = service_account.Credentials.from_service_account_file(
              os.path.join(os.environ["RUNNER_TEMP"], "play.json"),
              scopes=["https://www.googleapis.com/auth/androidpublisher"],
          )
          service = build("androidpublisher", "v3", credentials=credentials)
          edits = service.edits()


          def read_tracks():
              edit_id = edits.insert(packageName=package, body={}).execute()["id"]
              try:
                  return (
                      edits.tracks()
                      .list(packageName=package, editId=edit_id)
                      .execute()
                      .get("tracks", [])
                  )
              finally:
                  edits.delete(packageName=package, editId=edit_id).execute()


          def describe(label, tracks):
              print(f"{label}:")
              for track in sorted(tracks, key=lambda item: item["track"]):
                  releases = track.get("releases") or [{}]
                  for release in releases:
                      codes = ",".join(release.get("versionCodes") or []) or "-"
                      print(
                          f"  {track['track']:12s} "
                          f"status={release.get('status', 'none'):10s} codes={codes}"
                      )


          def attempt(description, track, releases):
              """One track change in its own edit, committed or wholly abandoned.

              Each change gets its own edit so a rejection of one does not roll
              back another, and so a partial success is still a success.
              """
              edit_id = edits.insert(packageName=package, body={}).execute()["id"]
              committed = False
              try:
                  edits.tracks().update(
                      packageName=package,
                      editId=edit_id,
                      track=track,
                      body={"track": track, "releases": releases},
                  ).execute()
                  try:
                      edits.commit(packageName=package, editId=edit_id).execute()
                  except HttpError as error:
                      # An app never published to production cannot send an edit
                      # for review; that is not a failure here.
                      if "changesNotSentForReview" not in str(error):
                          raise
                      print(f"  {description}: retrying without review")
                      edits.commit(
                          packageName=package,
                          editId=edit_id,
                          changesNotSentForReview=True,
                      ).execute()
                  committed = True
                  print(f"  {description}: committed")
                  return True
              except HttpError as error:
                  print(f"  {description}: rejected - {error}")
                  return False
              finally:
                  if not committed:
                      try:
                          edits.delete(packageName=package, editId=edit_id).execute()
                      except HttpError:
                          pass


          tracks = read_tracks()
          describe("before", tracks)
          by_name = {track["track"]: track for track in tracks}
          outcomes = []

          if halt_beta:
              live = [
                  release
                  for release in (by_name.get("beta") or {}).get("releases", [])
                  if release.get("status") in {"completed", "inProgress"}
              ]
              if not live:
                  print("beta: nothing live")
              else:
                  print("beta: stopping open testing")
                  # `halted` is really a staged-rollout concept and Play answers
                  # a 500 when asked to halt a fully released one, so fall back
                  # to emptying the track, which is what the Console's "pause"
                  # does. Both are tried because which one Play accepts depends
                  # on the release's state, not on anything visible here.
                  stopped = attempt(
                      "halt the live release",
                      "beta",
                      [
                          {
                              "name": release.get("name"),
                              "versionCodes": release.get("versionCodes"),
                              "status": "halted",
                          }
                          for release in live
                      ],
                  ) or attempt("empty the track", "beta", [])
                  outcomes.append(("stop open testing", stopped))

          if delete_production:
              production = (by_name.get("production") or {}).get("releases", [])
              drafts = [r for r in production if r.get("status") == "draft"]
              others = [r for r in production if r.get("status") != "draft"]
              if others:
                  # A live production release is a different decision from
                  # deleting a draft. Refuse rather than guess.
                  print("production: refusing, a non-draft release is present")
                  outcomes.append(("delete production draft", False))
              elif not drafts:
                  print("production: no draft")
              else:
                  print("production: deleting the draft")
                  outcomes.append(
                      (
                          "delete production draft",
                          attempt("empty the track", "production", []),
                      )
                  )

          describe("after", read_tracks())

          if not outcomes:
              print("nothing to do")
              raise SystemExit(0)
          print("--- outcome ---")
          for description, ok in outcomes:
              print(f"{description}: {'done' if ok else 'FAILED'}")
          # Fail the run if anything asked for did not happen, so a red run
          # always means the app is still on a track it should not be on.
          raise SystemExit(0 if all(ok for _, ok in outcomes) else 1)
          PY
