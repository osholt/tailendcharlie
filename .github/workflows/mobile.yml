name: Mobile CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mobile-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.44.6
  MOBILE_DIR: apps/mobile

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ env.MOBILE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check projected-navigation compliance guardrails
        working-directory: ${{ github.workspace }}
        run: python3 tools/projected-navigation-compliance.py
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --coverage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: flutter-coverage
          path: ${{ env.MOBILE_DIR }}/coverage/lcov.info
          if-no-files-found: error

  android:
    name: Android debug APK
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ${{ env.MOBILE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve build identity
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/tools/build-identity.sh" pubspec.yaml ci "$GITHUB_RUN_NUMBER" \
            | tee -a "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build debug APK
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --build-name="$RIDE_RELAY_APP_VERSION" \
            --build-number="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_APP_VERSION="$RIDE_RELAY_APP_VERSION" \
            --dart-define=RIDE_RELAY_APP_BUILD="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_DISTRIBUTION_TRACK="$RIDE_RELAY_DISTRIBUTION_TRACK" \
            --dart-define=RIDE_RELAY_BUILD_TIMESTAMP="$RIDE_RELAY_BUILD_TIMESTAMP"
      # The Kotlin tests have existed since #94 and have never run anywhere:
      # nothing in CI invoked Gradle's test task, so `AndroidAutoCompanionTest`
      # was decorative. Run here rather than in the quality job because
      # `android/gradlew` is gitignored by Flutter's own .gitignore and only
      # exists once a build has generated it (#602).
      - name: Run Android unit tests
        working-directory: ${{ env.MOBILE_DIR }}/android
        run: ./gradlew --console=plain :app:testDebugUnitTest
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ride-relay-android-debug
          path: ${{ env.MOBILE_DIR }}/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  ios:
    name: iOS unsigned debug app
    needs: quality
    runs-on: macos-15
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ${{ env.MOBILE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve build identity
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/tools/build-identity.sh" pubspec.yaml ci "$GITHUB_RUN_NUMBER" \
            | tee -a "$GITHUB_ENV"
      - run: flutter pub get
      - name: Build unsigned debug app
        run: |
          set -euo pipefail
          flutter build ios --debug --no-codesign \
            --build-name="$RIDE_RELAY_APP_VERSION" \
            --build-number="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_APP_VERSION="$RIDE_RELAY_APP_VERSION" \
            --dart-define=RIDE_RELAY_APP_BUILD="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_DISTRIBUTION_TRACK="$RIDE_RELAY_DISTRIBUTION_TRACK" \
            --dart-define=RIDE_RELAY_BUILD_TIMESTAMP="$RIDE_RELAY_BUILD_TIMESTAMP"
      - name: Run iOS native contract tests
        run: |
          set -euo pipefail
          simulator_id="$(
            xcrun simctl list devices available \
              | sed -nE 's/.*iPhone.*\(([[:xdigit:]-]{36})\).*/\1/p' \
              | sed -n '1p'
          )"
          test -n "$simulator_id"
          xcodebuild test \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -only-testing:RunnerTests \
            -disableAutomaticPackageResolution \
            -skipPackageUpdates \
            CODE_SIGNING_ALLOWED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ride-relay-ios-unsigned-debug
          path: ${{ env.MOBILE_DIR }}/build/ios/iphoneos/Runner.app
          if-no-files-found: error
