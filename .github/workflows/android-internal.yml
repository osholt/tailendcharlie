name: Android internal testing

on:
  workflow_dispatch:
    inputs:
      build_number:
        description: >-
          Android version code. Required, and higher than every code already in
          Google Play on any track (the next number after the last shipped
          build). There is no default: the workflow run number runs behind
          shipped codes and Play refuses the upload after a 15-minute build (#630).
        required: true
        type: string
      promote_to:
        description: >-
          Track to promote to after a successful upload. Testers are on alpha;
          "none" uploads to internal only and reaches no closed tester. beta is
          Google Play OPEN testing, which is public: it also needs
          confirm_open_testing, and its bundle never carries Android Auto.
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
          - none
      confirm_open_testing:
        description: >-
          Only for promote_to=beta, which publishes to the PUBLIC open-testing
          track. Type publish-open-testing to confirm. Ignored for every other
          destination.
        required: false
        default: ''
        type: string
      android_auto:
        description: >-
          Build WITH the Android Auto declarations (alpha or none only; refused
          for beta). Off is what every Play track ships today, and what open
          testing must ship: its Android for Cars review is blocking.
        required: true
        default: false
        type: boolean
      notification_mode:
        description: >-
          auto emails the closed tester group when one is configured and the
          build goes to alpha; dry-run only renders the mail into the run
          summary. Nothing is emailed for beta: the open-testing audience is not
          the closed group.
        required: true
        default: auto
        type: choice
        options:
          - auto
          - dry-run

permissions:
  contents: read
  # Reading this workflow's own previous successful run gives the notification a
  # truthful "what changed since the build testers already have".
  actions: read

concurrency:
  group: android-internal-upload
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.44.6
  FASTLANE_VERSION: 2.228.0
  MOBILE_DIR: apps/mobile
  PACKAGE_NAME: app.tailendcharlie

jobs:
  upload:
    name: Build and upload Android beta
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: android-internal
    defaults:
      run:
        working-directory: ${{ env.MOBILE_DIR }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Enough history for the tester release summary to list what changed.
          fetch-depth: 50
      - name: Require confirmation before publishing to open testing
        # First, before any build or upload. Open testing (beta) is public, and
        # on 27 July 2026 the app was found generally available on a stale
        # build nobody meant to publish. It also refuses an Android Auto bundle
        # for that track.
        working-directory: ${{ github.workspace }}
        env:
          PROMOTE_TO: ${{ inputs.promote_to }}
          CONFIRM_OPEN_TESTING: ${{ inputs.confirm_open_testing }}
          ANDROID_AUTO: ${{ inputs.android_auto }}
        run: |
          set -euo pipefail
          python3 -m tools.release.play_release_gate gate \
            --promote-to "$PROMOTE_TO" \
            --confirm "$CONFIRM_OPEN_TESTING" \
            --android-auto "$ANDROID_AUTO"
      - name: Check the build number against Google Play
        # First, before any build or signing work: a reused version code is
        # otherwise refused by Play only after the build and upload (#630). The
        # lookup is best effort; a malformed or already-used number fails here.
        working-directory: ${{ github.workspace }}
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_ACCOUNT_JSON" || {
            echo "::error::The GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret is empty for the android-internal environment." >&2
            exit 1
          }
          check_venv="$RUNNER_TEMP/build-number-venv"
          python3 -m venv "$check_venv"
          "$check_venv/bin/python" -m pip install --quiet \
            google-api-python-client==2.149.0 \
            google-auth==2.35.0 \
            google-auth-httplib2==0.2.0 \
            || echo "::warning::Could not install the Google API client; the build number is checked for format only."
          umask 077
          key_path="$RUNNER_TEMP/play-build-number.json"
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$key_path"
          "$check_venv/bin/python" -m tools.release.check_build_number android \
            --build-number "$BUILD_NUMBER" \
            --package "$PACKAGE_NAME" \
            --service-account-file "$key_path"
      - name: Check projected-navigation compliance guardrails
        working-directory: ${{ github.workspace }}
        run: python3 tools/projected-navigation-compliance.py
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install release signing materials
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEY_ALIAS"
          test -n "$KEY_PASSWORD"
          test -n "$STORE_PASSWORD"
          keystore_path="$RUNNER_TEMP/ride-relay-upload.jks"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore_path"
          cat > android/key.properties <<PROPERTIES
          storeFile=$keystore_path
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPERTIES
      - name: Resolve build identity
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          PROMOTE_TO: ${{ inputs.promote_to }}
        run: |
          set -euo pipefail
          # Stamp the track this build is *destined* for. Promotion reuses the
          # uploaded artefact and never rebuilds, so stamping `internal` here is
          # what told every closed tester they were on internal testing (#122).
          destination_track=internal
          if test "$PROMOTE_TO" != "none"; then
            destination_track="$PROMOTE_TO"
          fi
          "$GITHUB_WORKSPACE/tools/build-identity.sh" pubspec.yaml "$destination_track" "$BUILD_NUMBER" \
            | tee -a "$GITHUB_ENV"
      - name: Build App Bundle
        env:
          BUILD_NUMBER: ${{ inputs.build_number }}
          # Read by apps/mobile/android/app/build.gradle.kts. Flutter does not
          # forward -P flags, so the environment form is the one that reaches it.
          ORG_GRADLE_PROJECT_androidAuto: ${{ inputs.android_auto }}
          TESTER_NOTES_URL: https://github.com/${{ github.repository }}/blob/${{ github.sha }}/docs/tester-release-notes.md
          RIDE_RELAY_API_BASE_URL: ${{ vars.RIDE_RELAY_API_BASE_URL }}
          RIDE_RELAY_FIREBASE_API_KEY: ${{ vars.RIDE_RELAY_FIREBASE_API_KEY }}
          RIDE_RELAY_FIREBASE_PROJECT_ID: ${{ vars.RIDE_RELAY_FIREBASE_PROJECT_ID }}
          RIDE_RELAY_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.RIDE_RELAY_FIREBASE_MESSAGING_SENDER_ID }}
          RIDE_RELAY_FIREBASE_ANDROID_APP_ID: ${{ vars.RIDE_RELAY_FIREBASE_ANDROID_APP_ID }}
        run: |
          set -euo pipefail
          test -n "$RIDE_RELAY_API_BASE_URL" || {
            echo "::error::Set the RIDE_RELAY_API_BASE_URL repository variable to the deployed relay's HTTPS base URL (see docs/server-runbook.md)." >&2
            exit 1
          }
          push_enabled=false
          if test -n "$RIDE_RELAY_FIREBASE_API_KEY" \
            && test -n "$RIDE_RELAY_FIREBASE_PROJECT_ID" \
            && test -n "$RIDE_RELAY_FIREBASE_MESSAGING_SENDER_ID" \
            && test -n "$RIDE_RELAY_FIREBASE_ANDROID_APP_ID"; then
            push_enabled=true
          fi
          flutter pub get
          flutter build appbundle --release \
            --build-name="$RIDE_RELAY_APP_VERSION" \
            --build-number="$BUILD_NUMBER" \
            --dart-define=RIDE_RELAY_APP_VERSION="$RIDE_RELAY_APP_VERSION" \
            --dart-define=RIDE_RELAY_APP_BUILD="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_DISTRIBUTION_TRACK="$RIDE_RELAY_DISTRIBUTION_TRACK" \
            --dart-define=RIDE_RELAY_BUILD_TIMESTAMP="$RIDE_RELAY_BUILD_TIMESTAMP" \
            --dart-define=RIDE_RELAY_TESTER_NOTES_URL="$TESTER_NOTES_URL" \
            --dart-define=RIDE_RELAY_API_BASE_URL="$RIDE_RELAY_API_BASE_URL" \
            --dart-define=RIDE_RELAY_PUSH_ENABLED="$push_enabled" \
            --dart-define=RIDE_RELAY_FIREBASE_API_KEY="$RIDE_RELAY_FIREBASE_API_KEY" \
            --dart-define=RIDE_RELAY_FIREBASE_PROJECT_ID="$RIDE_RELAY_FIREBASE_PROJECT_ID" \
            --dart-define=RIDE_RELAY_FIREBASE_MESSAGING_SENDER_ID="$RIDE_RELAY_FIREBASE_MESSAGING_SENDER_ID" \
            --dart-define=RIDE_RELAY_FIREBASE_ANDROID_APP_ID="$RIDE_RELAY_FIREBASE_ANDROID_APP_ID" \
            --dart-define=RIDE_RELAY_RIDE_DIAGNOSTICS=true
      - name: Verify the Android Auto declarations match the build
        # Off (the default, and the only state beta may have): the source and
        # every merged release manifest must be free of Android Auto. On: the
        # merged release manifest must declare it, so the switch cannot quietly
        # do nothing. Either way this runs before anything is uploaded.
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_AUTO: ${{ inputs.android_auto }}
        run: |
          set -euo pipefail
          mapfile -t merged_manifests < <(
            find apps/mobile/build/app/intermediates \
              -path '*release*' -name AndroidManifest.xml -type f -print
          )
          test "${#merged_manifests[@]}" -gt 0 || {
            echo "::error::No merged release manifest was produced." >&2
            exit 1
          }
          if test "$ANDROID_AUTO" = "true"; then
            mapfile -t car_manifests < <(
              find apps/mobile/build/app/intermediates/merged_manifests \
                -path '*release*' -name AndroidManifest.xml -type f -print
            )
            test "${#car_manifests[@]}" -gt 0 || {
              echo "::error::No merged release manifest to check for Android Auto." >&2
              exit 1
            }
            python3 tools/assert-android-auto-disabled.py --expect enabled \
              "${car_manifests[@]}"
          else
            python3 tools/assert-android-auto-disabled.py \
              apps/mobile/android/app/src/main/AndroidManifest.xml \
              "${merged_manifests[@]}"
          fi
      - name: Validate Play service account secret
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: test -n "$SERVICE_ACCOUNT_JSON"
      - name: Upload to Play internal track
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ env.MOBILE_DIR }}/build/app/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
      - name: Install Fastlane
        if: ${{ success() && inputs.promote_to != 'none' }}
        run: |
          set -euo pipefail
          gem install fastlane \
            --version "$FASTLANE_VERSION" \
            --no-document \
            --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - name: Promote to the closed testing track
        id: promote
        if: ${{ success() && inputs.promote_to != 'none' }}
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          TARGET_TRACK: ${{ inputs.promote_to }}
          VERSION_CODE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_ACCOUNT_JSON"
          test -n "$VERSION_CODE"
          json_key_path="$RUNNER_TEMP/play-service-account.json"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$json_key_path"
          # Leaves the internal release active on purpose: the internal cohort
          # and the closed group are configured independently, and deactivating
          # the source strands internal testers on no available update.
          fastlane supply \
            --json_key "$json_key_path" \
            --package_name "$PACKAGE_NAME" \
            --track internal \
            --track_promote_to "$TARGET_TRACK" \
            --track_promote_release_status completed \
            --deactivate_on_promote false \
            --version_code "$VERSION_CODE"
      - name: Read the open-testing track back
        # A committed promotion is not evidence that the track serves anything:
        # fastlane exits 0 and the API can report a draft beside a live release.
        # This fails the run unless beta holds this version code, completed. It
        # cannot see whether the track is paused; only the Console shows that.
        if: ${{ success() && inputs.promote_to == 'beta' }}
        working-directory: ${{ github.workspace }}
        env:
          VERSION_CODE: ${{ inputs.build_number }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/build-number-venv/bin/python" -m tools.release.play_release_gate verify-track \
            --package "$PACKAGE_NAME" \
            --track beta \
            --version-code "$VERSION_CODE" \
            --service-account-file "$RUNNER_TEMP/play-build-number.json"
      - name: Collect what changed since the previous notified build
        if: ${{ success() && inputs.promote_to == 'alpha' }}
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_FILE: android-internal.yml
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          changes_file="$RUNNER_TEMP/tester-changes.md"
          previous_sha="$(gh run list \
            --repo "$GITHUB_REPOSITORY" \
            --workflow "$WORKFLOW_FILE" \
            --status success \
            --limit 20 \
            --json databaseId,headSha \
            --jq "[.[] | select(.databaseId < $RUN_ID) | .headSha] | first // \"\"" \
            2>/dev/null | tr -d '"' || true)"
          if test -n "$previous_sha" && git cat-file -e "$previous_sha^{commit}" 2>/dev/null; then
            baseline="the last released build (commit ${previous_sha:0:7})"
            git log --no-merges --pretty='- %s (%h)' "$previous_sha..HEAD" > "$changes_file"
          else
            baseline="the last 20 commits on this ref (no previous release commit available)"
            git log --no-merges --max-count=20 --pretty='- %s (%h)' > "$changes_file"
          fi
          echo "TESTER_CHANGES_FILE=$changes_file" >> "$GITHUB_ENV"
          echo "TESTER_CHANGES_BASELINE=$baseline" >> "$GITHUB_ENV"
      - name: Notify the closed tester group
        # Only after a successful promotion: the mail says testers can install
        # this build, so it must not go out when they cannot. A notification
        # problem must never fail a release, hence continue-on-error as well as
        # the tool's own exit-0 contract.
        if: ${{ success() && inputs.promote_to == 'alpha' }}
        continue-on-error: true
        env:
          NOTIFICATION_MODE: ${{ inputs.notification_mode }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TARGET_TRACK: ${{ inputs.promote_to }}
          TESTER_GROUP: ${{ vars.RIDE_RELAY_ANDROID_TESTER_GROUP }}
          TESTER_NOTIFY_FROM: ${{ vars.RIDE_RELAY_TESTER_NOTIFY_FROM }}
          TESTER_NOTIFY_SMTP_HOST: ${{ vars.RIDE_RELAY_TESTER_NOTIFY_SMTP_HOST }}
          TESTER_NOTIFY_SMTP_PORT: ${{ vars.RIDE_RELAY_TESTER_NOTIFY_SMTP_PORT }}
          TESTER_NOTIFY_SMTP_USERNAME: ${{ secrets.RIDE_RELAY_TESTER_NOTIFY_SMTP_USERNAME }}
          TESTER_NOTIFY_SMTP_PASSWORD: ${{ secrets.RIDE_RELAY_TESTER_NOTIFY_SMTP_PASSWORD }}
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/tester_notify/notify_testers.py" \
            --track "$TARGET_TRACK" \
            --app-version "$RIDE_RELAY_APP_VERSION" \
            --build-number "$RIDE_RELAY_APP_BUILD" \
            --commit "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-url "$RUN_URL" \
            --changes-file "${TESTER_CHANGES_FILE:-}" \
            --changes-baseline "${TESTER_CHANGES_BASELINE:-}" \
            --recipient "$TESTER_GROUP" \
            --mode "$NOTIFICATION_MODE"
      - name: Publish tester release summary
        if: always()
        env:
          PROMOTE_TO: ${{ inputs.promote_to }}
          ANDROID_AUTO: ${{ inputs.android_auto }}
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          app_version="${RIDE_RELAY_APP_VERSION:-unknown}"
          app_build="${RIDE_RELAY_APP_BUILD:-unknown}"
          track="${RIDE_RELAY_DISTRIBUTION_TRACK:-unknown}"
          built_at="${RIDE_RELAY_BUILD_TIMESTAMP:-unknown}"
          notes="$RUNNER_TEMP/tester-release-notes.md"
          # A green run used to say nothing about whether testers received
          # anything: version code 24 was uploaded on 24 July, never promoted,
          # and no closed tester ever saw it (#101, #122).
          if test "$PROMOTE_TO" = "none"; then
            reach='**No closed tester has this build.** It was uploaded to `internal` only - run this workflow with `promote_to`, or `Promote Android testing release`, to reach the closed track.'
          elif test "$PROMOTION_OUTCOME" = "success" && test "$PROMOTE_TO" = "beta"; then
            reach="**Google Play open testing (\`beta\`) now holds this build.** It is public: anyone with the opt-in link can install it once the track is unpaused. The track is paused and unpaused only in the Play Console, which this run cannot see - confirm the track state there. No tester email was sent."
          elif test "$PROMOTION_OUTCOME" = "success"; then
            reach="**Closed testers can install this now from the \`$PROMOTE_TO\` track.**"
          else
            reach="**No closed tester has this build:** promotion to \`$PROMOTE_TO\` did not succeed (\`${PROMOTION_OUTCOME:-not reached}\`)."
          fi
          {
            printf '# Android tester build %s\n\n' "$app_build"
            printf -- '- App version: `%s`\n' "$app_version"
            printf -- '- Build number (Play version code): `%s`\n' "$app_build"
            printf -- '- Uploaded to: `internal`\n'
            printf -- '- Stamped distribution track: `%s`\n' "$track"
            printf -- '- Android Auto declarations in this bundle: `%s`\n' "$ANDROID_AUTO"
            printf -- '- Built: `%s`\n' "$built_at"
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Workflow run: %s\n\n' "$RUN_URL"
            printf '%s\n\n' "$reach"
            printf 'Testers see this build identity under **Settings -> About & build**;\n'
            printf 'the distribution track it shows is the stamped track above.\n\n'
            printf '## Recent commits on this ref\n\n'
            git log --no-merges --max-count=20 --pretty='- %s (%h)' || true
            printf '\nCopy the tester-facing entry into `docs/tester-release-notes.md`'
            printf ' so build %s maps to changes.\n' "$app_build"
          } > "$notes"
          cat "$notes" >> "$GITHUB_STEP_SUMMARY"
          cp "$notes" "$GITHUB_WORKSPACE/tester-release-notes.md"
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailendcharlie-android-app-bundle
          path: ${{ env.MOBILE_DIR }}/build/app/outputs/bundle/release/*.aab
          if-no-files-found: ignore
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: tailendcharlie-tester-release-notes
          path: tester-release-notes.md
          if-no-files-found: ignore
