# Re-promotes an existing version code. `Android internal testing` promotes
# automatically at the end of a successful upload, so this workflow is for
# moving a build that is already in Play - after a rollback, or onto a second
# closed track. It deliberately sends no tester mail: it cannot know which
# commit an arbitrary version code was built from, and a tester notification
# that guesses the commit is worse than none.
name: Promote Android testing release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Existing Google Play version code to promote
        required: true
        type: string
      source_track:
        description: Existing Google Play source track
        required: true
        default: internal
        type: choice
        options:
          - internal
          - alpha
          - beta
      target_track:
        description: >-
          Google Play target track. beta is OPEN testing, which is public: it
          also needs confirm_open_testing, and the version code must come from
          a build made without Android Auto (build 88 or later).
        required: true
        default: alpha
        type: choice
        options:
          - alpha
          - beta
      confirm_open_testing:
        description: >-
          Only for target_track=beta. Type publish-open-testing to confirm a
          release to the public open-testing track. Ignored otherwise.
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: android-testing-promotion
  cancel-in-progress: false

env:
  FASTLANE_VERSION: 2.228.0
  PACKAGE_NAME: app.tailendcharlie

jobs:
  promote:
    name: Promote existing Android release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: android-internal
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Require confirmation before publishing to open testing
        # Open testing (beta) is public, and a re-promotion is exactly how a
        # stale build reached it unnoticed on 27 July 2026. A version code
        # carries no record of whether it was built with Android Auto, so the
        # dispatcher asserts it by using a build made without it.
        env:
          TARGET_TRACK: ${{ inputs.target_track }}
          CONFIRM_OPEN_TESTING: ${{ inputs.confirm_open_testing }}
        run: |
          set -euo pipefail
          python3 -m tools.release.play_release_gate gate \
            --promote-to "$TARGET_TRACK" \
            --confirm "$CONFIRM_OPEN_TESTING" \
            --android-auto false
      - name: Install Fastlane
        run: |
          gem install fastlane \
            --version "$FASTLANE_VERSION" \
            --no-document \
            --user-install
          echo "$(ruby -e 'puts Gem.user_dir')/bin" >> "$GITHUB_PATH"
      - name: Promote release
        id: promote
        env:
          SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          SOURCE_TRACK: ${{ inputs.source_track }}
          TARGET_TRACK: ${{ inputs.target_track }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          test -n "$SERVICE_ACCOUNT_JSON"
          test -n "$VERSION_CODE"
          json_key_path="$RUNNER_TEMP/play-service-account.json"
          umask 077
          printf '%s' "$SERVICE_ACCOUNT_JSON" > "$json_key_path"
          fastlane supply \
            --json_key "$json_key_path" \
            --package_name "$PACKAGE_NAME" \
            --track "$SOURCE_TRACK" \
            --track_promote_to "$TARGET_TRACK" \
            --track_promote_release_status completed \
            --deactivate_on_promote false \
            --version_code "$VERSION_CODE"
      - name: Summarise the promotion
        if: always()
        env:
          PROMOTION_OUTCOME: ${{ steps.promote.outcome }}
          SOURCE_TRACK: ${{ inputs.source_track }}
          TARGET_TRACK: ${{ inputs.target_track }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          set -euo pipefail
          {
            printf '# Promotion of version code %s\n\n' "$VERSION_CODE"
            printf -- '- From: `%s`\n' "$SOURCE_TRACK"
            printf -- '- To: `%s`\n' "$TARGET_TRACK"
            printf -- '- Result: `%s`\n\n' "${PROMOTION_OUTCOME:-not reached}"
            printf 'No tester notification is sent from this workflow: a re-promotion\n'
            printf 'cannot say which commit the version code was built from, and the\n'
            printf 'mail must not guess. `Android internal testing` notifies when it\n'
            printf 'promotes a build it has just produced.\n'
          } >> "$GITHUB_STEP_SUMMARY"
