name: Android dependency advisories

# `server.yml` runs pip-audit for Python; nothing scanned Gradle or Maven
# coordinates, so a vulnerable Android dependency reached `main` unremarked
# (#395). #352's Bouncy Castle advisory was found by a hand-written OSV query.
#
# GitHub's dependency graph does not resolve Gradle build files by itself, so
# enabling the graph alone would cover nothing here. This submits the *resolved*
# graph — the only way the transitive coordinates that carried #352's advisory
# are visible at all — which puts the Android dependencies under Dependabot
# alerts.
#
# The pull-request gate that fails a *newly introduced* vulnerable coordinate is
# deliberately not here yet. `dependency-review-action` compares the base and
# head snapshots, and until `main` carries a Gradle snapshot there is nothing to
# compare against: every existing coordinate reads as introduced by whichever
# pull request happens to be open. Merging this establishes that baseline; the
# gate follows in #395 once it exists.

on:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/android/**'
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/android-dependencies.yml'
  # Answering "who pulls this in, and does it ship" needs the resolved tree, which
  # needs a Gradle run, which needs JDK 21. #421 stalled on exactly that: the
  # advisory triage could establish that junit 4 is bundled in the APK but not
  # what puts it there. Dispatchable so the question can be asked without a merge.
  workflow_dispatch:
  pull_request:
    paths:
      - 'apps/mobile/android/**'
      - 'apps/mobile/pubspec.yaml'
      - 'apps/mobile/pubspec.lock'
      - '.github/workflows/android-dependencies.yml'

permissions:
  contents: read

concurrency:
  group: android-dependencies-${{ github.ref }}
  cancel-in-progress: true

env:
  MOBILE_DIR: apps/mobile
  FLUTTER_VERSION: 3.44.6

jobs:
  submit:
    name: Submit the resolved dependency graph
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # Submitting a dependency snapshot is a write to the repository's
      # dependency graph. A pull request from a fork gets a read-only token, so
      # this step cannot run there; see the review job for what that costs.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Capture the graph from the build Flutter itself runs, rather than
      # invoking Gradle directly. Two things make the direct route impossible
      # here: `android/gradlew` is gitignored (Flutter's own .gitignore), and
      # `settings.gradle.kts` requires a `local.properties` naming the Flutter
      # SDK, which is also gitignored and is written by the Flutter tool. Both
      # were found by trying it — the first attempt failed on the missing
      # wrapper in 26 seconds.
      #
      # setup-gradle installs an init script into the Gradle user home, so the
      # graph is generated by *any* Gradle build on this runner, including the
      # one `flutter build apk` launches. That also means the graph describes
      # the dependencies of the APK that actually ships, not of a synthetic
      # resolve.
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          dependency-graph: generate-and-submit
          # Only what ships. A Gradle build resolves the app's dependencies and
          # the Android Gradle Plugin's own, and the submitted snapshot cannot
          # tell them apart — gradle/actions documents that scope assignment
          # "does not yet exist". So every AGP transitive arrived as an
          # undifferentiated alert, and #421 measured the result: 44 of 47 were
          # build tooling nobody here can act on, including the one critical and
          # all 18 highs, while the only coordinate that reaches a phone was two
          # moderates lost in the noise.
          #
          # Restricting submission to the runtime classpaths makes the alert
          # count mean "advisories in code we ship", which is the only version of
          # it anyone will keep reading. Build-tool exposure is managed by
          # keeping AGP current instead; see SECURITY.md.
          dependency-graph-include-configurations: '.*RuntimeClasspath'

      - run: flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}
      - name: Resolve build identity
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          "$GITHUB_WORKSPACE/tools/build-identity.sh" pubspec.yaml ci "$GITHUB_RUN_NUMBER" \
            | tee -a "$GITHUB_ENV"
      - name: Build the debug APK so Gradle resolves every configuration
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          flutter build apk --debug \
            --build-name="$RIDE_RELAY_APP_VERSION" \
            --build-number="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_APP_VERSION="$RIDE_RELAY_APP_VERSION" \
            --dart-define=RIDE_RELAY_APP_BUILD="$RIDE_RELAY_APP_BUILD" \
            --dart-define=RIDE_RELAY_DISTRIBUTION_TRACK="$RIDE_RELAY_DISTRIBUTION_TRACK" \
            --dart-define=RIDE_RELAY_BUILD_TIMESTAMP="$RIDE_RELAY_BUILD_TIMESTAMP"

  report:
    name: Resolved dependency tree
    # Dispatch only. It answers a question rather than gating anything, and the
    # tree is large enough that producing it on every push would be noise.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: ${{ env.MOBILE_DIR }}
      # The build is what writes android/local.properties naming the Flutter SDK,
      # without which settings.gradle.kts cannot even configure, and what
      # generates the plugin projects most coordinates arrive through.
      - name: Build once so the Android project can be resolved
        working-directory: ${{ env.MOBILE_DIR }}
        run: flutter build apk --debug

      - name: Resolve the runtime classpaths
        working-directory: ${{ env.MOBILE_DIR }}/android
        run: |
          set -euo pipefail
          # The pinned version, read from the tracked wrapper properties rather
          # than repeated here, so a Flutter upgrade that moves it is followed.
          version="$(sed -n 's|.*/gradle-\(.*\)-all\.zip|\1|p' \
            gradle/wrapper/gradle-wrapper.properties)"
          test -n "$version" || { echo "::error::could not read the pinned Gradle version"; exit 1; }
          echo "pinned Gradle version: $version"
          if test -x ./gradlew; then
            gradle="./gradlew"
          else
            # android/gradlew is gitignored by Flutter's own .gitignore, so it may
            # not be here even after a build.
            curl --fail --silent --show-error --location \
              --output "$RUNNER_TEMP/gradle.zip" \
              "https://services.gradle.org/distributions/gradle-$version-bin.zip"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
            gradle="$RUNNER_TEMP/gradle-$version/bin/gradle"
          fi
          # Release as well as debug: the advisory triage in #421 measured a debug
          # APK, and a debug build legitimately carries more than a shipped one.
          for configuration in releaseRuntimeClasspath debugRuntimeClasspath; do
            echo "== $configuration =="
            "$gradle" --console=plain --no-daemon \
              :app:dependencies --configuration "$configuration" \
              > "$RUNNER_TEMP/$configuration.txt" || {
                echo "::warning::could not resolve $configuration"
                continue
              }
            # Named on purpose: these are the questions #421 is stuck on.
            for coordinate in junit: com.google.guava org.bouncycastle io.netty; do
              printf '  %-22s ' "$coordinate"
              grep -c -- "$coordinate" "$RUNNER_TEMP/$configuration.txt" || true
            done
          done

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: android-dependency-tree
          path: ${{ runner.temp }}/*RuntimeClasspath.txt
          if-no-files-found: error
