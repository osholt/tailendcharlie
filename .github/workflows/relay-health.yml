name: Relay health monitor

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-health-monitor
  cancel-in-progress: true

env:
  RELAY_BASE_URL: https://relay.tailendcharlie.app
  ALERT_TITLE: 'alert: relay health or deploy parity check failed'

jobs:
  monitor:
    name: Probe live relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The parity question is "is anything undeployed", which needs the
          # history between the deployed commit and the tip of main.
          fetch-depth: 0

      - name: Check liveness and deployed commit
        id: probe
        continue-on-error: true
        run: |
          set -euo pipefail
          # A deployment-parity failure needs an alert, but rebooting a healthy
          # guest cannot deploy the missing commit. Only make host recovery
          # eligible until both public API probes have been validated.
          echo "recovery_eligible=yes" >> "$GITHUB_OUTPUT"
          live_file="$RUNNER_TEMP/live.json"
          compatibility_file="$RUNNER_TEMP/compatibility.json"
          curl --fail --silent --show-error --max-time 15 \
            "$RELAY_BASE_URL/health/live" > "$live_file"
          curl --fail --silent --show-error --max-time 15 \
            "$RELAY_BASE_URL/api/v1/compatibility" > "$compatibility_file"

          python3 - "$live_file" "$compatibility_file" <<'PY' > "$RUNNER_TEMP/deployed"
          import json
          import pathlib
          import sys

          live = json.loads(pathlib.Path(sys.argv[1]).read_text())
          compatibility = json.loads(pathlib.Path(sys.argv[2]).read_text())
          if live != {"status": "ok"}:
              raise SystemExit(f"unexpected liveness document: {live!r}")
          protocol = compatibility.get("serverProtocol")
          if not isinstance(protocol, int) or protocol < 1:
              raise SystemExit(f"invalid server protocol: {protocol!r}")
          deployed = compatibility.get("serverBuildCommit")
          if not isinstance(deployed, str) or len(deployed) != 40:
              # `unknown` means the image was built outside the documented
              # deploy command, so nothing can vouch for what it contains.
              raise SystemExit(f"relay reports no usable build commit: {deployed!r}")
          print(deployed)
          PY
          echo "recovery_eligible=no" >> "$GITHUB_OUTPUT"
          deployed="$(cat "$RUNNER_TEMP/deployed")"

          # Parity is not "the relay is on the tip of main". Only apps/server
          # and deploy change what the relay serves, and relay-deploy.yml only
          # deploys pushes that touch them — so a docs merge legitimately
          # leaves the relay behind the tip. What must never be true is that a
          # commit which *does* touch them is newer than what is deployed.
          # That is the five-day gap in #393, stated exactly.
          git cat-file -e "$deployed^{commit}" 2>/dev/null || {
            echo "the relay reports $deployed, which is not a commit on this repository"
            exit 1
          }
          # HEAD, not origin/main: on a schedule the checkout is already the
          # default branch tip, and HEAD is the one ref that is always present.
          undeployed="$(git rev-list "$deployed..HEAD" -- apps/server deploy)"
          if test -n "$undeployed"; then
            count="$(printf '%s\n' "$undeployed" | wc -l | tr -d ' ')"
            echo "relay deploy mismatch: $count relay-affecting commit(s) are not deployed."
            echo "deployed: $deployed"
            printf 'undeployed: %s\n' $undeployed
            exit 1
          fi
          echo "relay healthy at commit $deployed, nothing relay-affecting undeployed"

      - name: Decide whether whole-guest recovery is needed
        id: recovery-gate
        if: ${{ steps.probe.outcome == 'failure' && steps.probe.outputs.recovery_eligible == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          OCI_CLI_USER: ${{ secrets.OCI_RECOVERY_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_RECOVERY_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_RECOVERY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_RECOVERY_PRIVATE_KEY }}
          OCI_CLI_REGION: ${{ secrets.OCI_RECOVERY_REGION }}
          OCI_INSTANCE_ID: ${{ secrets.OCI_RECOVERY_INSTANCE_ID }}
        run: |
          set -euo pipefail
          echo "should_recover=no" >> "$GITHUB_OUTPUT"

          missing=""
          for value in \
            "$OCI_CLI_USER" \
            "$OCI_CLI_TENANCY" \
            "$OCI_CLI_FINGERPRINT" \
            "$OCI_CLI_KEY_CONTENT" \
            "$OCI_CLI_REGION" \
            "$OCI_INSTANCE_ID"; do
            test -n "$value" || missing=yes
          done
          if test -n "$missing"; then
            echo "automatic OCI recovery is not configured; see the server runbook"
            exit 0
          fi

          # The first failed run opens the alert. Only a later failed run is
          # allowed to reboot anything, which filters one-runner or transient
          # Internet failures without leaving a real outage unattended.
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ALERT_TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" \
            | head -1)"
          if test -z "$issue_number"; then
            echo "no earlier failed probe exists; waiting for independent confirmation"
            exit 0
          fi

          last_recovery="$(gh api --paginate --slurp \
            "repos/$GITHUB_REPOSITORY/issues/$issue_number/comments?per_page=100" \
            --jq 'map(.[]) | map(select(.body | startswith("Automatic OCI recovery requested"))) | last | .created_at // ""')"
          if test -n "$last_recovery"; then
            last_epoch="$(date -d "$last_recovery" +%s)"
            now_epoch="$(date +%s)"
            if ((now_epoch - last_epoch < 1800)); then
              echo "an OCI recovery was requested within the 30-minute cooldown"
              exit 0
            fi
          fi

          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "should_recover=yes" >> "$GITHUB_OUTPUT"

      - name: Request a graceful OCI soft reset
        id: soft-reset
        if: ${{ steps.recovery-gate.outputs.should_recover == 'yes' }}
        uses: oracle-actions/run-oci-cli-command@368cc7991534d1b8074846d10e1d84ac4c0d1a28 # v1.3.2
        env:
          OCI_CLI_USER: ${{ secrets.OCI_RECOVERY_USER }}
          OCI_CLI_TENANCY: ${{ secrets.OCI_RECOVERY_TENANCY }}
          OCI_CLI_FINGERPRINT: ${{ secrets.OCI_RECOVERY_FINGERPRINT }}
          OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_RECOVERY_PRIVATE_KEY }}
          OCI_CLI_REGION: ${{ secrets.OCI_RECOVERY_REGION }}
        with:
          command: >-
            compute instance action
            --instance-id ${{ secrets.OCI_RECOVERY_INSTANCE_ID }}
            --action SOFTRESET

      - name: Record the automatic recovery attempt
        if: ${{ steps.soft-reset.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.recovery-gate.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --body "Automatic OCI recovery requested at $(date -u +%FT%TZ): graceful SOFTRESET after two failed external probes. Run: $RUN_URL"

      - name: Open or update an alert issue
        if: ${{ steps.probe.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ALERT_TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" \
            | head -1)"
          body="$(printf \
            'The scheduled relay probe failed at %s.\n\nRun: %s\n\nThe check verifies HTTPS liveness, the compatibility document, and that no commit touching `apps/server` or `deploy` on `main` is newer than the commit the running image reports. No response body is copied into this issue.' \
            "$(date -u +%FT%TZ)" \
            "$RUN_URL")"
          if test -n "$issue_number"; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ALERT_TITLE" \
              --label bug \
              --body "$body"
          fi
          exit 1

      - name: Close a recovered alert
        if: ${{ steps.probe.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ALERT_TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" \
            | while read -r issue_number; do
                test -n "$issue_number" || continue
                gh issue comment "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body "Recovered at $(date -u +%FT%TZ). Run: $RUN_URL"
                gh issue close "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --reason completed
              done
