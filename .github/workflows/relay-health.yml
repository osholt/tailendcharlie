name: Relay health monitor

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: relay-health-monitor
  cancel-in-progress: true

env:
  RELAY_BASE_URL: https://relay.tailendcharlie.app
  ALERT_TITLE: 'alert: relay health or deploy parity check failed'

jobs:
  monitor:
    name: Probe live relay
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check liveness and deployed commit
        id: probe
        continue-on-error: true
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          live_file="$RUNNER_TEMP/live.json"
          compatibility_file="$RUNNER_TEMP/compatibility.json"
          curl --fail --silent --show-error --max-time 15 \
            "$RELAY_BASE_URL/health/live" > "$live_file"
          curl --fail --silent --show-error --max-time 15 \
            "$RELAY_BASE_URL/api/v1/compatibility" > "$compatibility_file"
          python3 - "$live_file" "$compatibility_file" "$EXPECTED_COMMIT" <<'PY'
          import json
          import pathlib
          import sys

          live = json.loads(pathlib.Path(sys.argv[1]).read_text())
          compatibility = json.loads(pathlib.Path(sys.argv[2]).read_text())
          expected_commit = sys.argv[3]
          if live != {"status": "ok"}:
              raise SystemExit(f"unexpected liveness document: {live!r}")
          deployed_commit = compatibility.get("serverBuildCommit")
          if deployed_commit != expected_commit:
              raise SystemExit(
                  "relay deploy mismatch: "
                  f"expected {expected_commit}, received {deployed_commit!r}"
              )
          protocol = compatibility.get("serverProtocol")
          if not isinstance(protocol, int) or protocol < 1:
              raise SystemExit(f"invalid server protocol: {protocol!r}")
          print(f"relay healthy at commit {deployed_commit}, protocol {protocol}")
          PY

      - name: Open or update an alert issue
        if: ${{ steps.probe.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          issue_number="$(gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ALERT_TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" \
            | head -1)"
          body="The scheduled relay probe failed at $(date -u +%FT%TZ).\n\nRun: $RUN_URL\n\nThe check verifies HTTPS liveness, the compatibility document and exact deployed-main commit parity. No response body is copied into this issue."
          if test -n "$issue_number"; then
            gh issue comment "$issue_number" --repo "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create \
              --repo "$GITHUB_REPOSITORY" \
              --title "$ALERT_TITLE" \
              --label bug \
              --body "$body"
          fi
          exit 1

      - name: Close a recovered alert
        if: ${{ steps.probe.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search "\"$ALERT_TITLE\" in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"$ALERT_TITLE\") | .number" \
            | while read -r issue_number; do
                test -n "$issue_number" || continue
                gh issue comment "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --body "Recovered at $(date -u +%FT%TZ). Run: $RUN_URL"
                gh issue close "$issue_number" \
                  --repo "$GITHUB_REPOSITORY" \
                  --reason completed
              done
