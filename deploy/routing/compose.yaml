# Self-hosted routing and geocoding for the open beta (#917).
# See docs/routing-service.md before changing anything here.
#
# Runs on its own Oracle Ampere A1 VM, never on the relay host. No host
# details live in this file; the repository is public. The hostname, data
# directory and limits come from deploy/routing/.env on the routing host.
#
# The engines serve whatever ROUTING_DATA_DIR/<engine>/live points at.
# routing-data-refresh.sh builds new data beside it, tests it, then moves the
# link and recreates the container: a bind mount resolves the link when the
# container is created, so a plain restart keeps serving the old build.

name: tec-routing

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: '3'

services:
  valhalla:
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    restart: unless-stopped
    user: '${ROUTING_UID:?run through routing-deploy.sh}:${ROUTING_GID:?run through routing-deploy.sh}'
    # Serve only. The image's own entrypoint would start a tile build in the
    # live directory if anything looked missing; builds belong to the refresh
    # script, in a separate directory.
    entrypoint: [valhalla_service]
    command: [/custom_files/valhalla.json, '${VALHALLA_SERVER_THREADS:-2}']
    volumes:
      - ${ROUTING_DATA_DIR:?set ROUTING_DATA_DIR}/valhalla/live:/custom_files:ro
    mem_limit: ${VALHALLA_MEMORY_LIMIT:-3g}
    networks: [routing]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:8002/status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    # Discarded, not rotated. valhalla_service always writes each request line,
    # query string included, and the app and the planner put the route in the
    # query string: these logs would be a record of where riders went. Health
    # is judged by the healthcheck and the smoke tests instead.
    logging:
      driver: none

  photon:
    build:
      context: photon
    image: tec-routing-photon:1.3.0
    restart: unless-stopped
    user: '${ROUTING_UID:?run through routing-deploy.sh}:${ROUTING_GID:?run through routing-deploy.sh}'
    command:
      - -Xms${PHOTON_HEAP:-2g}
      - -Xmx${PHOTON_HEAP:-2g}
      - -jar
      - /opt/photon.jar
      - serve
      - -data-dir
      - /photon
      - -listen-ip
      - 0.0.0.0
      - -listen-port
      - '2322'
      - -max-results
      - '10'
      - -max-reverse-results
      - '5'
      - -default-language
      - en
    # Read-write: the embedded search engine keeps lock and state files beside
    # the index even when it only serves.
    volumes:
      - ${ROUTING_DATA_DIR:?set ROUTING_DATA_DIR}/photon/live:/photon
    mem_limit: ${PHOTON_MEMORY_LIMIT:-4g}
    networks: [routing]
    healthcheck:
      test: [CMD, curl, --fail, --silent, --max-time, '5', 'http://127.0.0.1:2322/status']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    logging: *logging

  caddy:
    build:
      context: caddy
    image: tec-routing-caddy:2.11.4
    restart: unless-stopped
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
      # Metrics for the host only; see the :2020 block in the Caddyfile.
      - 127.0.0.1:2020:2020
    environment:
      ROUTING_DOMAIN: ${ROUTING_DOMAIN:?set ROUTING_DOMAIN}
      ROUTING_CLIENT_ID: ${ROUTING_CLIENT_ID:-tailendcharlie.app}
      ROUTING_EXTRA_ORIGIN: ${ROUTING_EXTRA_ORIGIN:-https://tailendcharlie.app}
      ROUTING_MAX_REQUEST_BYTES: ${ROUTING_MAX_REQUEST_BYTES:-1MB}
      ROUTING_ROUTE_EVENTS_PER_MINUTE: ${ROUTING_ROUTE_EVENTS_PER_MINUTE:-60}
      ROUTING_ROUTE_EVENTS_PER_MINUTE_TOTAL: ${ROUTING_ROUTE_EVENTS_PER_MINUTE_TOTAL:-1200}
      ROUTING_MATCHING_EVENTS_PER_MINUTE: ${ROUTING_MATCHING_EVENTS_PER_MINUTE:-240}
      ROUTING_MATCHING_EVENTS_PER_MINUTE_TOTAL: ${ROUTING_MATCHING_EVENTS_PER_MINUTE_TOTAL:-3000}
      ROUTING_GEOCODING_EVENTS_PER_MINUTE: ${ROUTING_GEOCODING_EVENTS_PER_MINUTE:-120}
      ROUTING_GEOCODING_EVENTS_PER_MINUTE_TOTAL: ${ROUTING_GEOCODING_EVENTS_PER_MINUTE_TOTAL:-3000}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    mem_limit: 256m
    networks: [routing]
    logging: *logging

networks:
  routing:
    name: tec-routing

volumes:
  caddy-data:
  caddy-config:
